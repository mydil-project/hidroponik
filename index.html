<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontrol Pompa Hydroponik</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="topbar">
    <div>
      <h1>Kontrol Pompa Hydroponik</h1>
      <p class="sub" id="deviceMeta">ESP32 &middot; memuat konfigurasi...</p>
    </div>
    <div class="badge" id="statusBadge">
      <span class="dot"></span>
      <span id="statusBadgeText">Menghubungkan...</span>
    </div>
  </header>

  <main>
    <!-- ============ Kendali pompa ============ -->
    <section class="card">
      <h2>Kendali Pompa</h2>

      <div class="mode-switch" role="tablist" aria-label="Mode kontrol">
        <button type="button" class="mode-btn active" data-mode="auto">Otomatis (jadwal)</button>
        <button type="button" class="mode-btn" data-mode="manual">Manual</button>
      </div>

      <div class="relay-box">
        <button type="button" class="relay" id="relayBtn" aria-pressed="false">
          <span class="relay-icon" id="relayIcon">&#9211;</span>
          <span class="relay-text">
            <strong id="relayText">MEMATIKAN</strong>
            <small id="relaySource">menunggu laporan perangkat</small>
          </span>
        </button>
      </div>

      <dl class="stats">
        <div>
          <dt>Waktu perangkat</dt>
          <dd id="lastSeen">&ndash;</dd>
        </div>
        <div>
          <dt>Sinyal WiFi</dt>
          <dd id="rssi">&ndash;</dd>
        </div>
        <div>
          <dt>Alamat IP</dt>
          <dd id="ip">&ndash;</dd>
        </div>
        <div>
          <dt>Sisa waktu pompa</dt>
          <dd id="sisa">&ndash;</dd>
        </div>
      </dl>
    </section>

    <!-- ============ Jadwal ============ -->
    <section class="card">
      <div class="card-head">
        <h2>Jadwal Pompa Otomatis</h2>
        <span class="hint" id="dirtyHint">tersimpan</span>
      </div>

      <div class="table-wrap">
        <table class="jadwal">
          <thead>
            <tr>
              <th>Slot</th>
              <th>Aktif</th>
              <th>Jam</th>
              <th>Menit</th>
            </tr>
          </thead>
          <tbody id="jadwalBody"></tbody>
        </table>
      </div>

      <div class="durasi-row">
        <label for="durasi">Durasi pompa otomatis</label>
        <div class="inline">
          <input type="number" id="durasi" min="1" max="240" step="1">
          <span>menit</span>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn primary" id="saveBtn">Simpan jadwal</button>
        <button type="button" class="btn ghost" id="defaultBtn">Jadwal bawaan</button>
      </div>
      <p class="note">Jam mengikuti zona waktu perangkat (GMT+7 / WIB).</p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>

</html>
